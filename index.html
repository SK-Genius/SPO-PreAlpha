<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wiki Viewer</title>
	<style>
		:root {
			--paper: rgba(255, 250, 241, 0.9);
			--paper-edge: rgba(125, 102, 78, 0.18);
			--ink: #241d18;
			--muted: #695a4d;
			--accent: #7f4f24;
			--line: rgba(127, 79, 36, 0.22);
			--shadow: 0 24px 60px rgba(70, 49, 31, 0.14);
			--error: #7f1d1d;
			--error-bg: rgba(202, 70, 70, 0.09);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
			color: var(--ink);
			background: radial-gradient(circle at top, #fff9ef 0%, #f0e2cd 36%, #e1cfba 100%);
			line-height: 1.35;
		}

		.shell {
			width: calc(100% - 2rem);
			max-width: none;
			margin: clamp(1rem, 4vw, 3rem) auto;
			padding: clamp(1rem, 3vw, 2.5rem);
			background: var(--paper);
			border: 1px solid var(--paper-edge);
			border-radius: 22px;
			box-shadow: var(--shadow);
			backdrop-filter: blur(10px);
		}

		.wiki-article {
			padding-top: 0;
		}

		.status,
		.error {
			margin: 0;
			padding: 1rem 1.1rem;
			border-radius: 14px;
			background: rgba(127, 79, 36, 0.08);
			color: var(--muted);
			white-space: pre-wrap;
		}

		.error {
			background: var(--error-bg);
			color: var(--error);
		}

		.wiki-title-bar,
		.wiki-heading-bar {
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.wiki-title-bar h1,
		.wiki-heading-bar h2 {
			flex: 1 1 auto;
			min-width: 0;
			margin-right: 0;
		}

		.wiki-title-bar button,
		.wiki-heading-bar button,
		.wiki-edit-actions button {
			flex: 0 0 auto;
			border: 1px solid rgba(127, 79, 36, 0.22);
			border-radius: 999px;
			padding: 0.42rem 0.75rem;
			background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,237,219,0.92));
			color: var(--ink);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		.wiki-edit-panel:not(.wiki-edit-inline) {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			height: 100vh;
			height: 100dvh;
			width: min(42rem, 42vw);
			z-index: 10000;
			display: flex;
			flex-direction: column;
			margin: 0;
			padding: 0.85rem;
			border: 1px solid rgba(125, 102, 78, 0.28);
			border-radius: 0.95rem 0 0 0.95rem;
			background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(249,243,233,0.96));
			box-shadow: 0 24px 60px rgba(70, 49, 31, 0.18);
		}


		.wiki-edit-panel:not(.wiki-edit-inline) .wiki-edit-textarea {
			display: block;
			width: 100%;
			min-height: 12rem;
			flex: 1 1 auto;
			padding: 0.75rem;
			border: 1px solid rgba(125, 102, 78, 0.28);
			border-radius: 0.6rem;
			font-family: Consolas, "SFMono-Regular", "Courier New", monospace;
			font-size: 0.95rem;
			line-height: 1.35;
			resize: none;
		}


		.wiki-edit-actions {
			display: flex;
			gap: 0.6rem;
			margin-top: 0.7rem;
		}

		.wiki-edit-status {
			margin: 0.7rem 0 0;
			white-space: pre-wrap;
			color: var(--error);
		}

		body.wiki-editor-open .shell {
			padding-right: min(44rem, 44vw);
		}

		@media (max-width: 900px) {
			.wiki-edit-panel {
				left: 1rem;
				width: auto;
			}

			body.wiki-editor-open .shell {
				padding-right: clamp(1rem, 3vw, 2.5rem);
			}
		}


		@media print {
			body {
				background: #ffffff;
			}

			.shell {
				width: 100%;
				margin: 0;
				padding: 0;
				border: 0;
				border-radius: 0;
				box-shadow: none;
				background: transparent;
			}

		}
	</style>
</head>
<body>
	<main class="shell">
		<article id="app" class="wiki-article" aria-live="polite">HTML geladen.</article>
	</main>

	<script>
		window.addEventListener("error", function (event) {
			console.error("window error:", event.message, event.filename, event.lineno, event.colno, event.error || "");
		});

		window.addEventListener("unhandledrejection", function (event) {
			console.error("unhandled rejection:", event.reason);
		});
	</script>

	<script type="module">
		const app = document.getElementById("app");
		const inMemorySources = new Map();
		const loadedModules = new Map();
		const viewerMap = new Map();
		let viewerMapLoaded = false;
		let rootLinkBasePromise = null;
		let rootLinkBaseValue = "";

		function trace(message, value) {
			const line = "[module] " + message + (value === undefined ? "" : " " + String(value));
			console.log(line, value === undefined ? "" : value);
		}

		function show(text, className = "status") {
			trace("show", text);
			const node = document.createElement("p");
			node.className = className;
			node.textContent = text;
			app.className = "wiki-article";
			app.replaceChildren(node);
		}

		function normalizeSlashes(path) {
			return String(path || "").split(String.fromCharCode(92)).join("/");
		}

		function normalizeSource(source) {
			const text = String(source ?? "");
			const cr = String.fromCharCode(13);
			const lf = String.fromCharCode(10);
			return text
				.split(cr + lf).join(lf)
				.split(lf + cr).join(lf)
				.split(cr).join(lf);
		}

		function normalizePath(path) {
			return normalizeSlashes(path || "./index.wiki");
		}

		async function ensureRootLinkBase() {
			if (rootLinkBasePromise) return rootLinkBasePromise;

			rootLinkBasePromise = (async () => {
				try {
					const response = await fetch("./js/root.conf", { cache: "no-store" });
					if (!response.ok) {
						rootLinkBaseValue = "";
						return rootLinkBaseValue;
					}

					const line = normalizeSource(await response.text())
						.split(String.fromCharCode(10))
						.map((entry) => entry.trim())
						.find((entry) => entry);

					rootLinkBaseValue = line
						? normalizeSlashes(line).replace(/\/+$/, "") + "/"
						: "";
				} catch (error) {
					trace("root.conf failed", error);
					rootLinkBaseValue = "";
				}

				return rootLinkBaseValue;
			})();

			return rootLinkBasePromise;
		}

		function getExtension(path) {
			const clean = String(path || "").split("?")[0].split("#")[0];
			const fileName = normalizeSlashes(clean).split("/").pop() || "";
			const dot = fileName.lastIndexOf(".");
			return dot >= 0 ? fileName.slice(dot + 1).toLowerCase() : "wiki";
		}

		async function ensureViewerMap() {
			if (viewerMapLoaded) return;
			viewerMapLoaded = true;
			try {
				const res = await fetch("./js/viewer.ini", { cache: "no-store" });
				if (!res.ok) return;
				const text = await res.text();
				for (const line of normalizeSource(text).split(String.fromCharCode(10))) {
					const t = line.trim();
					if (!t || t.startsWith("#")) continue;
					const i = t.indexOf("=");
					if (i < 0) continue;
					const key = t.slice(0, i).trim();
					const val = t.slice(i + 1).trim();
					viewerMap.set(key, val);
				}
				trace("viewer.ini loaded", Object.fromEntries(viewerMap));
			} catch (e) {
				trace("viewer.ini failed", e);
			}
		}

		function getViewerPath(ext) {
			const key = ext || "";
			if (viewerMap.has(key)) return "./js/" + viewerMap.get(key);
			if (viewerMap.has("*")) return "./js/" + viewerMap.get("*");
			return "./js/viewer.txt.js";
		}

		function createNavigationUrl(path) {
			return "index.html?file=" + encodeURIComponent(path);
		}

		function createSourceFileUrl(path) {
			const normalizedPath = normalizePath(path);
			if (/^(https?:\/\/|ftp:\/\/|mailto:|www\.)/i.test(normalizedPath)) {
				return normalizedPath;
			}

			const relativePath = normalizedPath.replace(/^\.\//, "");
			return rootLinkBaseValue
				? rootLinkBaseValue + relativePath
				: normalizedPath;
		}

		function fileNameLabel(path) {
			const clean = String(path || "").split("?")[0].split("#")[0];
			const fileName = normalizeSlashes(clean).split("/").pop() || "";
			return fileName || clean || "Document";
		}

		function setPageTitle(title, kind) {
			const cleanTitle = String(title || "").trim();
			const cleanKind = String(kind || "").trim();
			document.title = cleanTitle
				? cleanKind
					? cleanTitle + " - " + cleanKind + " Viewer"
					: cleanTitle + " - Wiki Viewer"
				: "Wiki Viewer";
		}

		function resolveRelativePath(base, target) {
			const normalizedTarget = normalizeSlashes(target);
			if (/^(https?:\/\/|ftp:\/\/|mailto:|www\.)/i.test(normalizedTarget)) return normalizedTarget;

			const baseParts = normalizeSlashes(base).split("/");
			baseParts.pop();

			for (const part of normalizedTarget.split("/")) {
				if (!part || part === ".") continue;
				if (part === "..") baseParts.pop();
				else baseParts.push(part);
			}

			return baseParts.join("/") || target;
		}

		async function checkedFetchText(path, options = {}) {
			const normalizedPath = normalizePath(path);

			if (inMemorySources.has(normalizedPath)) {
				trace("memory source hit", normalizedPath);
				return inMemorySources.get(normalizedPath);
			}

			if (!options.quiet) {
				show("Datei wird geladen: " + normalizedPath + " ...");
			}
			trace("fetch start", normalizedPath);

			const response = await fetch(normalizedPath, { cache: "no-store" });
			trace("fetch response", normalizedPath + " HTTP " + response.status + " " + response.headers.get("content-type"));

			if (!response.ok) {
				throw new Error(normalizedPath + " konnte nicht geladen werden: HTTP " + response.status);
			}

			const text = await response.text();
			trace("fetch text length", text.length);
			return normalizeSource(text);
		}

		async function loadViewerForExtension(ext, options = {}) {
			await ensureViewerMap();
			const normalizedExt = ext || "txt";
			const viewerPath = getViewerPath(normalizedExt);

			// cache PROMISE to avoid parallel imports
			if (loadedModules.has(viewerPath)) return loadedModules.get(viewerPath);

			const loadPromise = (async () => {
				if (!options.quiet) {
					show("Importiere " + viewerPath + " ...");
				}
				trace("import start", viewerPath);
				trace("protocol", window.location.protocol);

				let mod;
				try {
					mod = await import(viewerPath);
				} catch (error) {
					// fallback to txt viewer
					if (normalizedExt !== "txt") {
						trace("import fallback", viewerPath + " -> ./js/viewer.txt.js");
						return await loadViewerForExtension("txt");
					}
					throw error;
				}

				trace("import ok", Object.keys(mod).join(", "));

				const renderer = typeof mod.render === "function"
					? mod
					: mod.default && mod.default.renderer && typeof mod.default.renderer.render === "function"
						? mod.default.renderer
						: null;
				const binary = Boolean(
					mod && mod.isBinary === true
					|| mod && mod.default && mod.default.isBinary === true
				);

				if (!renderer) {
					if (normalizedExt !== "txt") {
						trace("renderer fallback", viewerPath + " -> ./js/viewer.txt.js");
						return await loadViewerForExtension("txt");
					}
					throw new Error(viewerPath + " exportiert keine render(source, context)-Funktion.");
				}

				return {
					render: renderer.render,
					isBinary: binary
				};
			})();

			loadedModules.set(viewerPath, loadPromise);
			return loadPromise;
		}

		async function renderFile(filePath) {
			const normalizedFilePath = normalizePath(filePath);
			const ext = getExtension(normalizedFilePath);
			const viewer = await loadViewerForExtension(ext);
			await ensureRootLinkBase();
			const source = viewer.isBinary
				? ""
				: await checkedFetchText(normalizedFilePath);

			trace("render start", normalizedFilePath);
			viewer.render(source, createRenderContext(normalizedFilePath));
			trace("render done", normalizedFilePath);
		}

		function createRenderContext(filePath, articleElement = app, options = {}) {
			const targetElement = articleElement || app;
			const isEmbedded = Boolean(options.isEmbedded);
			const context = {
				filePath,
				articleElement: targetElement,
				isEmbedded,
				showSourceFilename: options.showSourceFilename !== undefined ? options.showSourceFilename : !isEmbedded,
				fileNameLabel,
				createSourceFileUrl(path) {
					trace("context.createSourceFileUrl", path);
					return createSourceFileUrl(path);
				},
				setPageTitle(title, kind) {
					if (isEmbedded) return;
					trace("context.setPageTitle", title + (kind ? " [" + kind + "]" : ""));
					setPageTitle(title, kind);
				},
				prepareArticle(className) {
					trace("context.prepareArticle", className);
					targetElement.className = className;
					targetElement.replaceChildren();
				},
				resolveRelativePath(base, target) {
					const resolved = resolveRelativePath(base, target);
					trace("context.resolveRelativePath", base + " -> " + target + " = " + resolved);
					return resolved;
				},
				createNavigationUrl(path) {
					trace("context.createNavigationUrl", path);
					return createNavigationUrl(path);
				},
				hasKnownRenderableExtension(path) {
					const e = getExtension(path);
					return viewerMap.has(e) || viewerMap.has("*");
				},
				async renderResourceReference(ext, resourcePath, embeddedTarget) {
					await ensureViewerMap();
					await ensureRootLinkBase();
					const normalizedExt = ext || getExtension(resourcePath) || "txt";
					const viewer = await loadViewerForExtension(normalizedExt, { quiet: true });
					const normalizedFilePath = normalizePath(resourcePath);

					if (viewer.isBinary) {
						viewer.render("", createRenderContext(normalizedFilePath, embeddedTarget, {
							isEmbedded: true,
							showSourceFilename: true
						}));
						return;
					}

					const source = await checkedFetchText(normalizedFilePath, { quiet: true });
					await this.renderEmbeddedSource(normalizedExt, source, embeddedTarget, normalizedFilePath, {
						showSourceFilename: true
					});
				},
				async renderEmbeddedSource(ext, source, embeddedTarget, embeddedFilePath, options = {}) {
					await ensureViewerMap();
					await ensureRootLinkBase();
					const normalizedExt = ext || getExtension(embeddedFilePath) || "txt";
					const viewer = await loadViewerForExtension(normalizedExt, { quiet: true });
					const normalizedFilePath = normalizePath(embeddedFilePath || ("embedded." + normalizedExt));
					viewer.render(
						viewer.isBinary ? String(source ?? "") : normalizeSource(source),
						createRenderContext(normalizedFilePath, embeddedTarget, {
							isEmbedded: true,
							showSourceFilename: options.showSourceFilename === true
						})
					);
				}
			};

			if (!isEmbedded) {
				context.updateWikiSource = async function updateWikiSource(nextSource) {
					if (getExtension(filePath) !== "wiki") {
						throw new Error("Nur .wiki-Dateien koennen im Viewer bearbeitet werden.");
					}

					const normalizedSource = normalizeSource(nextSource);
					inMemorySources.set(normalizePath(filePath), normalizedSource);
					trace("memory source updated", filePath + " length " + normalizedSource.length);
					await renderFile(filePath);
				};
			}

			return context;
		}

		try {
			trace("module script reached");
			trace("try start");

			const params = new URLSearchParams(window.location.search);
			const filePath = params.get("file") || "./index.wiki";
			await renderFile(filePath);
		} catch (error) {
			trace("catch", error && error.stack || error && error.message || String(error));
			show("Startfehler:\n" + (error && error.stack || error && error.message || String(error)), "error");
		}
	</script>
</body>
</html>
